name: Windows build and self-tests

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 10
    defaults:
      run:
        shell: powershell
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build native Windows application
        run: ./build.ps1
      - name: Run EXE self-tests
        run: |
          $taskApp = Get-ChildItem -LiteralPath build -Filter '*.exe' -File | Select-Object -First 1
          if (!$taskApp) { throw 'Build output missing.' }
          $taskErrorLog = Join-Path $env:RUNNER_TEMP 'codex-selftest-error.txt'
          $taskRun = Start-Process -FilePath $taskApp.FullName -ArgumentList '--self-test' -PassThru -Wait -WindowStyle Hidden -RedirectStandardError $taskErrorLog
          if ($taskRun.ExitCode -ne 0) {
            if (Test-Path -LiteralPath $taskErrorLog) { Get-Content -LiteralPath $taskErrorLog }
            throw ('EXE self-tests failed: ' + $taskRun.ExitCode)
          }
      - name: Run script edition self-tests
        run: ./Start-Repair.ps1 -Mode SelfTest
      - name: Keep unsigned build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: codex-proxy-repair-windows-unsigned
          path: build/*.exe
          if-no-files-found: error
          retention-days: 14
